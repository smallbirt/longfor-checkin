services:
  checkin:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8091}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先运行 python3 manage.py setup}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      TZ: Asia/Shanghai
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - checkin-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  checkin-data:
