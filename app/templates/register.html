<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/static/favicon.svg"><title>注册 · 每日签到</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/web.css?v=20261023"></head><body class="login-page"><main class="login-box"><div class="brand-mark">✓</div><p class="eyebrow">开始自己的每日计划</p><h1>创建你的账号</h1><p class="muted">注册后连接自己的签到账号，为每个账号安排独立计划。</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{2,31}" required autofocus value="{{ request.form.get('username', '') }}"><p class="hint">3–32 位字母、数字、下划线或短横线，以字母或数字开头。不区分大小写。</p><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" minlength="10" maxlength="128" required><p class="hint">至少 10 个字符，请使用独立于龙湖账号的密码。</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary wide" type="submit">注册并进入</button></form><p class="auth-switch">已有账号？<a href="/login">返回登录 →</a></p></main></body></html>
