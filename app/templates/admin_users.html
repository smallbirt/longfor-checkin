<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f6"><meta name="csrf-token" content="{{ session.csrf }}">
  <title>用户管理 · 每日签到</title>
  <link rel="stylesheet" href="/static/admin-users.css?v=20261027">
  <script defer src="/static/admin-users.js?v=20261027"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a class="brand" href="#users"><span class="brand-symbol">✓</span><span>每日签到<small>管理中心</small></span></a>
    <p class="nav-label">平台管理</p>
    <nav aria-label="管理导航" id="navigation"></nav>
    <div style="margin-top:22px"><a class="subtle" href="/admin">← 平台设置</a><br><a class="subtle" href="/">← 我的工作台</a></div><div class="sidebar-bottom"><div class="side-note"><span data-icon="shield"></span><strong>每个账号，各自安排</strong><p>独立计划 · 清晰权益 · 操作可追溯</p></div><small>DAILY CHECK-IN · ADMIN</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">管理中心 <span>/</span> <strong id="breadcrumb">用户管理</strong></div><div class="topbar-right"><span class="prototype-pill">{% if config.get('WEB_PREVIEW') %}隔离预览 · 临时数据{% else %}用户管理{% endif %}</span><span class="admin-avatar">A</span><span class="admin-name">{{ g.user.username }}<small>超级管理员</small></span></div></header>
    <nav class="mobile-nav" id="mobile-navigation" aria-label="移动端管理导航"></nav>
    <main id="main" tabindex="-1">{% if config.get('WEB_PREVIEW') %}<p class="notice">本地隔离预览 · 临时用户数据</p>{% endif %}</main>
    <footer><span>北京时间 · 管理员操作留痕</span><button class="link" data-action="refresh">刷新数据</button></footer>
  </div>
  <dialog class="drawer" id="user-drawer" aria-labelledby="drawer-name"></dialog>
  <dialog class="modal" id="action-dialog" aria-labelledby="action-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
