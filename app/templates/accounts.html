{% extends 'base.html' %}
{% block title %}我的签到 · 每日签到{% endblock %}
{% block content %}
<section class="intro"><div><p class="eyebrow">MY CHECK-INS</p><h1>我的签到</h1><p class="muted">一个地方，管理不同程序和账号的每日计划。</p></div><a href="/accounts/new" class="button-link primary"><span data-icon="plus" aria-hidden="true"></span>添加账号</a></section>
<p class="hint">自动打卡名额已用满时，可在 <a href="/credits">积分与名额</a> 中查看余额并扩容。</p><section class="account-toolbar"><div class="filter-chips" role="group" aria-label="按程序筛选"><button class="filter-chip active" data-program="all" aria-pressed="true">全部程序</button><button class="filter-chip" data-program="app" aria-pressed="false">龙湖 App</button><button class="filter-chip" data-program="mini" aria-pressed="false">龙湖小程序</button></div><div class="toolbar-fields"><label class="search-field"><span data-icon="search" aria-hidden="true"></span><input id="account-search" type="search" placeholder="搜索账号昵称" aria-label="搜索账号昵称"></label><select id="status-filter" aria-label="账号状态"><option value="all">全部状态</option><option value="signed">今日已签到</option><option value="unsigned">待签到</option><option value="attention">需要处理</option><option value="paused">计划已暂停</option></select></div></section><p class="list-count" id="account-list-count">正在读取账号…</p><div id="account-cards" class="account-cards" aria-live="polite"></div><div class="notice subtle-notice"><span data-icon="info" aria-hidden="true"></span><span>同一种程序可以添加多个账号，登录凭证、签到计划和记录分别保存。</span></div>
{% endblock %}
