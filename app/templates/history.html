{% extends 'base.html' %}
{% block title %}运行记录 · 每日签到{% endblock %}
{% block content %}
<section class="intro"><div><p class="eyebrow">ACTIVITY LOG</p><h1>每一次，都有记录。</h1><p class="muted">签到与通知分别记录，通知失败不会触发重复签到。</p></div><div class="actions intro-actions"><button id="retry-mail" class="secondary"><span data-icon="refresh" aria-hidden="true"></span>重试失败邮件</button></div></section>
<section class="card panel"><form id="history-filters" class="history-filters"><div><label for="history-program">签到程序</label><select id="history-program"><option value="">全部程序</option><option value="app">龙湖 App</option><option value="mini">龙湖小程序</option></select></div><div><label for="history-account">账号</label><select id="history-account"><option value="">全部账号</option></select></div><div><label for="history-date">日期</label><input id="history-date" type="date"></div><div><label for="history-state">执行结果</label><select id="history-state"><option value="">全部结果</option><option value="signed">已签到</option><option value="unsigned">确认未签到</option><option value="auth_expired">登录失效</option><option value="unknown">待确认</option><option value="request_error">请求异常</option><option value="captcha_required">需要验证</option><option value="credentials_missing">待配置</option><option value="inactive">活动未开放</option></select></div><button class="quiet" type="reset">清除筛选</button></form><div id="jobs"><p class="muted">正在加载记录…</p></div><div class="pagination"><button id="previous-page" class="secondary" disabled>上一页</button><span id="page-number" aria-live="polite">第 1 页</span><button id="next-page" class="secondary" disabled>下一页</button></div></section>
{% endblock %}
