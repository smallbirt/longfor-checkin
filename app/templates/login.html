<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/static/favicon.svg"><title>登录 · 每日签到</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/web.css?v=20261023"></head><body class="login-page"><main class="login-box"><div class="brand-mark">✓</div><p class="eyebrow">自己的签到小助手</p><h1>每天，少惦记一件事。</h1><p class="muted">登录自己的账号，管理多个程序、多个账号的签到和通知。</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="username">用户名</label><input id="username" name="username" required autocomplete="username" maxlength="32" autofocus value="{{ request.form.get('username', '') }}"><label for="password">密码</label><input id="password" type="password" name="password" required maxlength="128" autocomplete="current-password">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary wide" type="submit">登录</button></form>{% if registration %}<p class="auth-switch">还没有账号？<a href="/register">注册自己的账号 →</a></p>{% endif %}<p class="auth-switch"><a href="/help">第一次使用？查看图文操作手册 →</a></p><p class="auth-switch"><a href="/video">观看操作视频 →</a></p><p class="footnote">忘记普通账号密码时，请联系管理员重置。</p></main></body></html>
