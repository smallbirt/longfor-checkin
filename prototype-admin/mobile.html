<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机预览 · 用户管理</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf0ec;font:12px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#4b6a59}.device{padding:18px 0;max-width:100%}p{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 2px 12px}a{color:#167564;font-size:11px}iframe{width:375px;max-width:100vw;height:812px;display:block;border:1px solid #cedbd2;border-radius:17px;background:white;box-shadow:0 14px 55px #25493920}.landscape iframe{width:812px;height:375px}@media(max-width:400px){.device{padding:0}p{padding:10px;margin:0}iframe{border:0;border-radius:0;height:calc(100dvh - 39px)}}</style></head>
<body><div class="device"><p><span id="preview-label">375px 手机预览</span><a id="orientation" href="#landscape">横屏预览</a><a href="index.html">完整页面</a></p><iframe src="index.html" title="用户管理移动端原型"></iframe></div><script>function orient(){const landscape=location.hash==='#landscape';document.querySelector('.device').classList.toggle('landscape',landscape);document.getElementById('preview-label').textContent=landscape?'812px 横屏预览':'375px 手机预览';const link=document.getElementById('orientation');link.textContent=landscape?'竖屏预览':'横屏预览';link.href=landscape?'#portrait':'#landscape';}addEventListener('hashchange',orient);orient();</script></body></html>
